[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
]

[tool.ruff.lint.per-file-ignores]
"dfl/neural_network/start_service.py" = ["E402", "I001"]
"zk_inference/create_single_mnist_query.py" = ["E402", "I001"]
"zk_inference/prepare_mnist_input.py" = ["E402", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
