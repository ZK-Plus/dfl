[project]
name = "thesis-pytorch-compat"
version = "0.1.0"
description = "PyTorch drop-in adapter for the thesis C++ FL executable"
requires-python = ">=3.10"
dependencies = [
  "cryptography",
  "pyzmq",
  "torch",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["thesis_pytorch_compat*"]
