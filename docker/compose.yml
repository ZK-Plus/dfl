---
services:
  anvil:
    #image: ghcr.io/foundry-rs/foundry:latest
    image: ghcr.io/foundry-rs/foundry:${FOUNDRY_IMAGE_TAG:-nightly-dd0a687aa36ec731b6ea2cda2aa4f32e192814fa}
    container_name: anvil
    environment:
      ANVIL_IP_ADDR: "0.0.0.0"
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
      #
      ANVIL_HARDFORK: ${ANVIL_HARDFORK:-osaka}
    working_dir: /anvil
    ports:
      - "8545:8545"
    entrypoint: 
      - anvil
    command:
      - --accounts
      - "20"
      #
      - --hardfork
      #
      - ${ANVIL_HARDFORK:-osaka}
      - --code-size-limit
      - "999999"
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://localhost:8545 >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 1s
      retries: 15
  
  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs_local
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4001"
      - "127.0.0.1:5001:5001"
      - "127.0.0.1:8080:8080"
    tmpfs:
      - /data/ipfs
  
  smart-contracts: 
    build:
      context: ..
    #  dockerfile: docker/Dockerfile_Smart_Contracts
    #image: sonak53/dfl-sc:latest
      dockerfile: docker/Dockerfile_Master
      args:
        FOUNDRY_VERSION: ${FOUNDRY_IMAGE_TAG:-nightly-dd0a687aa36ec731b6ea2cda2aa4f32e192814fa}
    image: sonak53/dfl-master:latest
    container_name: smart-contracts
    platform: linux/amd64  
    environment:
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
      IPFS_PROVIDER: ${IPFS_PROVIDER}
      DOCKER: ${DOCKER}
      KEEP_ALIVE: ${KEEP_ALIVE}
      PCCS_FMSPC: ${PCCS_FMSPC}
      PCCS_FETCH: ${PCCS_FETCH}
      PCCS_TEE: ${PCCS_TEE}
      P256_MODE: ${P256_MODE:-native}
      P256_VERIFIER_ADDRESS: ${P256_VERIFIER_ADDRESS:-}
      DEPLOY_TDX_V4_DCAP: ${DEPLOY_TDX_V4_DCAP}
      VERIFY_TDX_QUOTE_ONCHAIN: ${VERIFY_TDX_QUOTE_ONCHAIN}
      PCCS_QUOTE_PATH: ${PCCS_QUOTE_PATH:-./data/phala_tdx_quote}
      INITIAL_GM_CID: ${INITIAL_GM_CID}
      INITIAL_GM_SIG_CID: ${INITIAL_GM_SIG_CID}
      INITIAL_GM_SIGNER_ADDRESS: ${INITIAL_GM_SIGNER_ADDRESS}
    command: ["/dfl/smart_contracts/starter_docker.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  #remote-attestation: 
  #  build:
  #    context: ..
  #    dockerfile: docker/Dockerfile_Remote_Attestation
  #  image: sonak53/dfl-ra:latest_10
  #  container_name: remote-attestation
  #  platform: linux/amd64
  #  depends_on:
  #    anvil:
  #      condition: service_healthy
  #  environment:
  #    FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
  #    IPFS_PROVIDER: ${IPFS_PROVIDER}
  #    DOCKER: ${DOCKER}
  #    INITIAL_GM_CID: ${INITIAL_GM_CID}
  #  command: ["/dfl/remote_attestation/starter_docker.sh"]

  VM-0:
    build:
      context: ..
      dockerfile: docker/Dockerfile_Worker
    image: sonak53/dfl-server-img:latest_local
    platform: linux/amd64
    depends_on:
      #remote-attestation:
      smart-contracts:
        condition: service_completed_successfully
    container_name: ${W0_ACCOUNT_ADDRESS}
    environment:
      API_KEY: ${API_KEY}
      API_SECRET: ${API_SECRET}
      PINATA_JWT: ${PINATA_JWT}
      IPFS_GATEWAY: ${IPFS_GATEWAY}
      KUBO_API: ${KUBO_API}
      KUBO_GATEWAY: ${KUBO_GATEWAY}
      IPFS_PROVIDER: ${IPFS_PROVIDER}
      DOCKER: ${DOCKER}
      REGISTRY_ADDRESS: ${REGISTRY_ADDRESS}
      AGGREGATOR_ADDRESS: ${AGGREGATOR_ADDRESS}
      GM_STORAGE_ADDRESS: ${GM_STORAGE_ADDRESS}
      SEPOLIA_RPC_URL: ${RPC_URL}
      CLIENT_LIMIT: ${CLIENT_LIMIT}
      EPOCH: ${EPOCH}
      ROUND: ${ROUND}
      ACCOUNT_ADDRESS: ${W0_ACCOUNT_ADDRESS}
      PRIVATE_KEY: ${W0_PRIVATE_KEY}
      DEVICE_ID: ${W0_DEVICE_ID}
      RSA_PRIVATE_KEY: ${W0_RSA_PRIVATE_KEY}
      RSA_PUBLIC_KEY: ${W0_RSA_PUBLIC_KEY}
    #volumes:
    #  - .cloud_setup/ansible/config/training_data/train-images-0.idx3-ubyte:/dfl/node_server/data/train-images.idx3-ubyte
    #  - .cloud_setup/ansible/config/training_data/train-labels-0.idx1-ubyte:/dfl/node_server/data/train-labels.idx1-ubyte
    #  - .cloud_setup/ansible/config/test_data/t10k-images.idx3-ubyte:/dfl/node_server/data/t10k-images.idx3-ubyte
    #  - .cloud_setup/ansible/config/test_data/t10k-labels.idx1-ubyte:/dfl/node_server/data/t10k-labels.idx1-ubyte
    command: ["/bin/sh", "-c", "cp /dfl/config/training_data/train-images-0.idx3-ubyte /dfl/node_server/data/train-images.idx3-ubyte && \
        cp /dfl/config/training_data/train-labels-0.idx1-ubyte /dfl/node_server/data/train-labels.idx1-ubyte && \
        cp /dfl/config/test_data/t10k-images.idx3-ubyte /dfl/node_server/data/t10k-images.idx3-ubyte && \
        cp /dfl/config/test_data/t10k-labels.idx1-ubyte /dfl/node_server/data/t10k-labels.idx1-ubyte && \
        cp /dfl/keys/private_key.pem /dfl/node_server/private_key.pem && \
        cp /dfl/keys/public_key.pem /dfl/node_server/public_key.pem && \
        exec node /dfl/node_server/dist/server.js"]

