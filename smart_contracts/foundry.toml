[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
ffi = true
optimizer = true
optimizer_runs = 200
via_ir = true
ignored_error_codes = [2018, 2072, 2424, 2519, 5574, 6321, 8429]
allow_paths = ["./tmp", "./lib", "./data", "./data/pccs_temp", "/tmp", "/tmp/*", "/tmp/**"]
fs_permissions = [
  { access = "read", path = "./data" },
  { access = "read", path = "./data/pccs_temp" }
]
